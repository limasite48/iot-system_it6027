version: '3.8'

# Insecure IoT Device Detection & Management Platform (IT6027)
# Root Docker Compose Orchestrator (Emulation Testbed + Security Platform)

networks:
  vlan10_standard_iot:
    name: iot_vlan10_standard
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.10.0/24
          gateway: 172.28.10.1

  vlan99_quarantine_iot:
    name: iot_vlan99_quarantine
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.99.0/24
          gateway: 172.28.99.1

services:
  # 1. Simulated IP Camera (D-Link DCS-932L emulation)
  mock-camera-01:
    build:
      context: ./mock-object/templates/camera-mock
      dockerfile: Dockerfile
    image: iot-mock-camera:latest
    container_name: mock-camera-01
    hostname: dlink-cam-01
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.20
    restart: unless-stopped

  # 2. Simulated Smart Plug (TP-Link HS100 emulation)
  mock-smartplug-01:
    build:
      context: ./mock-object/templates/smartplug-mock
      dockerfile: Dockerfile
    image: iot-mock-smartplug:latest
    container_name: mock-smartplug-01
    hostname: smartplug-01
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.21
    restart: unless-stopped

  # 3. Simulated DVR Gateway (Xiongmai H.264 DVR emulation)
  mock-dvr-01:
    build:
      context: ./mock-object/templates/dvr-gateway-mock
      dockerfile: Dockerfile
    image: iot-mock-dvr:latest
    container_name: mock-dvr-01
    hostname: dvr-gateway-01
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.22
    restart: unless-stopped

  # 4. Security Auditor & Governance Dashboard Platform
  net-sec-platform:
    build:
      context: ./net-sec
      dockerfile: Dockerfile
    image: iot-net-sec:latest
    container_name: iot-net-sec-platform
    ports:
      - "8000:8000"
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.90
    restart: unless-stopped
    depends_on:
      - mock-camera-01
      - mock-smartplug-01
      - mock-dvr-01
