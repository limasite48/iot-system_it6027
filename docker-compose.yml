version: '3.8'

# Multi-VLAN IoT Testbed & Governance Platform Compose Stack
# Flexible & Scalable:
#   To generate custom/scaled multi-device topologies of ANY arbitrary size (e.g. 6, 10, 20 devices):
#   run: python mock-object/fleet_manager.py generate-compose --devices <COUNT> --out docker-compose.override.yml

networks:
  vlan10_standard_iot:
    name: iot_vlan10_standard
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.10.0/24
          gateway: 172.28.10.1

  vlan99_quarantine_iot:
    name: iot_vlan99_quarantine
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.99.0/24
          gateway: 172.28.99.1

services:
  # Node #1: Vulnerable IP Camera (D-Link DCS-932L - CRITICAL Default Credentials)
  mock-device-01:
    build:
      context: ./mock-object
      dockerfile: templates/camera-mock/Dockerfile
    image: iot-mock-camera:latest
    container_name: mock-device-01
    hostname: dlink-dcs932l-01
    environment:
      - CAMERA_PROFILE=dlink_dcs932l
      - MOCK_IP=172.28.10.20
      - HTTP_PORT=8080
      - RTSP_PORT=554
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.20
    restart: unless-stopped

  # Node #2: Compliant Safety Smart TV (Sony BRAVIA - LOW Risk / Protected Baseline)
  mock-device-02:
    build:
      context: ./mock-object
      dockerfile: templates/camera-mock/Dockerfile
    image: iot-mock-camera:latest
    container_name: mock-device-02
    hostname: sony-bravia-tv-02
    environment:
      - CAMERA_PROFILE=hardened_sony_tv
      - MOCK_IP=172.28.10.21
      - HTTP_PORT=8443
      - RTSP_PORT=Disabled
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.21
    restart: unless-stopped

  # Node #3: Vulnerable Smart AC (Daikin Inverter AC - CRITICAL Open Access Controls)
  mock-device-03:
    build:
      context: ./mock-object
      dockerfile: templates/camera-mock/Dockerfile
    image: iot-mock-camera:latest
    container_name: mock-device-03
    hostname: daikin-smart-ac-03
    environment:
      - CAMERA_PROFILE=daikin_smart_ac
      - MOCK_IP=172.28.10.22
      - HTTP_PORT=80
      - RTSP_PORT=Disabled
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.22
    restart: unless-stopped

  # Node #4: Compliant Safety Enterprise Camera (ProSafe IP Camera - LOW Risk / Protected Baseline)
  mock-device-04:
    build:
      context: ./mock-object
      dockerfile: templates/camera-mock/Dockerfile
    image: iot-mock-camera:latest
    container_name: mock-device-04
    hostname: hardened-cam-04
    environment:
      - CAMERA_PROFILE=hardened_cam
      - MOCK_IP=172.28.10.23
      - HTTP_PORT=8443
      - RTSP_PORT=554
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.23
    restart: unless-stopped

  # Isolated Quarantine Test Node (VLAN 99)
  mock-device-quarantine:
    build:
      context: ./mock-object
      dockerfile: templates/camera-mock/Dockerfile
    image: iot-mock-camera:latest
    container_name: mock-device-quarantine
    hostname: quarantined-device
    environment:
      - CAMERA_PROFILE=dlink_dcs932l
      - MOCK_IP=172.28.99.20
      - HTTP_PORT=8080
      - RTSP_PORT=554
    networks:
      vlan99_quarantine_iot:
        ipv4_address: 172.28.99.20
    restart: unless-stopped

  # Central MQTT Broker
  net-core-mqtt:
    image: eclipse-mosquitto:2.0
    container_name: iot-net-core-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./net-core/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.10
    restart: unless-stopped

  # Security Auditor & Governance Platform
  net-sec-platform:
    build:
      context: ./net-sec
      dockerfile: Dockerfile
    image: iot-net-sec:latest
    container_name: iot-net-sec-platform
    ports:
      - "8000:8000"
    volumes:
      - ./net-sec/data:/app/data
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.90
      vlan99_quarantine_iot:
        ipv4_address: 172.28.99.90
    restart: unless-stopped
    depends_on:
      - mock-device-01
      - mock-device-02
      - mock-device-03
      - mock-device-04
      - net-core-mqtt
