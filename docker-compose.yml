version: '3.8'

# Auto-generated Camera Fleet Compose Stack
networks:
  vlan10_standard_iot:
    name: iot_vlan10_standard
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.10.0/24
          gateway: 172.28.10.1

  vlan99_quarantine_iot:
    name: iot_vlan99_quarantine
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.99.0/24
          gateway: 172.28.99.1

services:
  mock-camera-01:
    build:
      context: ./mock-object
      dockerfile: templates/camera-mock/Dockerfile
    image: iot-mock-camera:latest
    container_name: mock-camera-01
    hostname: dlink-dcs932l-01
    environment:
      - CAMERA_PROFILE=dlink_dcs932l
      - MOCK_IP=172.28.10.20
      - HTTP_PORT=8080
      - RTSP_PORT=554
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.20
    restart: unless-stopped

  mock-camera-02:
    build:
      context: ./mock-object
      dockerfile: templates/camera-mock/Dockerfile
    image: iot-mock-camera:latest
    container_name: mock-camera-02
    hostname: hikvision-ds2cd-02
    environment:
      - CAMERA_PROFILE=hikvision_ds2cd
      - MOCK_IP=172.28.10.21
      - HTTP_PORT=80
      - RTSP_PORT=554
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.21
    restart: unless-stopped

  mock-camera-03:
    build:
      context: ./mock-object
      dockerfile: templates/camera-mock/Dockerfile
    image: iot-mock-camera:latest
    container_name: mock-camera-03
    hostname: dahua-ipc-03
    environment:
      - CAMERA_PROFILE=dahua_ipc
      - MOCK_IP=172.28.10.22
      - HTTP_PORT=80
      - RTSP_PORT=554
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.22
    restart: unless-stopped

  mock-camera-04:
    build:
      context: ./mock-object
      dockerfile: templates/camera-mock/Dockerfile
    image: iot-mock-camera:latest
    container_name: mock-camera-04
    hostname: open-access-cam-04
    environment:
      - CAMERA_PROFILE=open_access_cam
      - MOCK_IP=172.28.10.23
      - HTTP_PORT=8081
      - RTSP_PORT=554
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.23
    restart: unless-stopped

  mock-camera-quarantine:
    build:
      context: ./mock-object
      dockerfile: templates/camera-mock/Dockerfile
    image: iot-mock-camera:latest
    container_name: mock-camera-quarantine
    hostname: quarantined-cam
    environment:
      - CAMERA_PROFILE=dlink_dcs932l
      - MOCK_IP=172.28.99.20
      - HTTP_PORT=8080
      - RTSP_PORT=554
    networks:
      vlan99_quarantine_iot:
        ipv4_address: 172.28.99.20
    restart: unless-stopped

  net-core-mqtt:
    image: eclipse-mosquitto:2.0
    container_name: iot-net-core-mqtt
    ports:
      - "1883:1883"
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.10
    restart: unless-stopped

  net-sec-platform:
    build:
      context: ./net-sec
      dockerfile: Dockerfile
    image: iot-net-sec:latest
    container_name: iot-net-sec-platform
    ports:
      - "8000:8000"
    networks:
      vlan10_standard_iot:
        ipv4_address: 172.28.10.90
      vlan99_quarantine_iot:
        ipv4_address: 172.28.99.90
    restart: unless-stopped
    depends_on:
      - mock-camera-01
      - mock-camera-02
      - mock-camera-03
      - mock-camera-04
